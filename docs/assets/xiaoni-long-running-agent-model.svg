<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">小腻长期群聊 Agent 工作模型</title>
  <desc id="desc">A one-page operating model diagram for Xiaoni as a long-running group chat agent, showing the current-turn participation loop and the long-term self-evolution memory loop.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8f6; }
      .title { font: 700 43px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #162229; }
      .subtitle { font: 400 21px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #52616a; }
      .h { font: 700 23px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #17242c; }
      .h2 { font: 700 19px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #17242c; }
      .body { font: 400 17px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #33444d; }
      .small { font: 400 15px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #5a6870; }
      .tiny { font: 400 13px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #68767e; }
      .chip { font: 700 14px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #d7ddd9; stroke-width: 2; rx: 18; }
      .panel-blue { fill: #edf7fc; stroke: #99c6dd; stroke-width: 2; rx: 18; }
      .panel-green { fill: #edf8f0; stroke: #98cda2; stroke-width: 2; rx: 18; }
      .panel-gold { fill: #fff8e8; stroke: #dfc06a; stroke-width: 2; rx: 18; }
      .panel-rose { fill: #fff0ee; stroke: #dfa09a; stroke-width: 2; rx: 18; }
      .panel-purple { fill: #f4f0fb; stroke: #b7a8d8; stroke-width: 2; rx: 18; }
      .panel-dark { fill: #23313a; stroke: #23313a; stroke-width: 2; rx: 18; }
      .lane { fill: #eef4f0; stroke: #c7d7cd; stroke-width: 2; rx: 26; }
      .lane2 { fill: #f4f2ee; stroke: #d8d1c5; stroke-width: 2; rx: 26; }
      .arrow { stroke: #5f6d75; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #8b989f; stroke-width: 2.5; fill: none; marker-end: url(#arrow-soft); stroke-dasharray: 7 7; }
      .arrow-green { stroke: #46745a; stroke-width: 3.5; fill: none; marker-end: url(#arrow-green); }
      .arrow-gold { stroke: #a67a20; stroke-width: 3; fill: none; marker-end: url(#arrow-gold); }
      .line { stroke: #d2d8d4; stroke-width: 2; }
      .badge-blue { fill: #377d9c; }
      .badge-green { fill: #4b8f5b; }
      .badge-gold { fill: #ac7d1c; }
      .badge-rose { fill: #b15c54; }
      .badge-purple { fill: #6c579b; }
      .badge-dark { fill: #23313a; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#5f6d75"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#8b989f"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#46745a"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#a67a20"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="70" y="65">小腻长期群聊 Agent 工作模型</text>
  <text class="subtitle" x="72" y="103">一页讲清：小腻每一轮怎么参与群聊，以及每一轮之后如何沉淀成下一轮的成长。</text>

  <g transform="translate(70 140)">
    <rect class="lane" x="0" y="0" width="1460" height="350"/>
    <text class="h" x="28" y="42">A. 当前轮参与闭环：先看场，再观己，最后选择怎么在场</text>

    <g transform="translate(35 82)">
      <rect class="panel-blue" x="0" y="0" width="220" height="205"/>
      <rect class="badge-blue" x="0" y="0" width="220" height="40" rx="18"/>
      <text class="chip" x="22" y="26">1 群聊环境</text>
      <text class="body" x="20" y="70">QQ群里发生新消息</text>
      <text class="small" x="20" y="104">多人滚动聊天</text>
      <text class="small" x="20" y="132">回复 / 引用 / @</text>
      <text class="small" x="20" y="160">话语指向、关系事实</text>
      <text class="tiny" x="20" y="188">外部世界：QQ</text>
    </g>

    <g transform="translate(305 82)">
      <rect class="panel-green" x="0" y="0" width="245" height="205"/>
      <rect class="badge-green" x="0" y="0" width="245" height="40" rx="18"/>
      <text class="chip" x="22" y="26">2 工作上下文</text>
      <text class="body" x="20" y="70">把现场组装成这一轮可思考的材料</text>
      <text class="small" x="20" y="104">已读消息 + 未读消息</text>
      <text class="small" x="20" y="132">上一轮小腻的OS</text>
      <text class="small" x="20" y="160">身份事实 + 召回经验</text>
      <text class="tiny" x="20" y="188">working memory / context</text>
    </g>

    <g transform="translate(605 66)">
      <rect class="panel-gold" x="0" y="0" width="310" height="238"/>
      <rect class="badge-gold" x="0" y="0" width="310" height="40" rx="18"/>
      <text class="chip" x="22" y="26">3 小腻运行脑</text>
      <text class="body" x="22" y="70">不是一次性生成回复，而是被工具门控的判断循环：</text>
      <text class="small" x="22" y="104">先理解未读：发生了什么</text>
      <text class="small" x="22" y="132">再判断：有没有具体可说点</text>
      <text class="small" x="22" y="160">必要时召回：过去学过什么</text>
      <text class="small" x="22" y="188">最后选择：沉默 / 求知 / 发言</text>
      <text class="tiny" x="22" y="220">小腻主AGENT + runtime contract + tool choice</text>
    </g>

    <g transform="translate(970 82)">
      <rect class="panel-rose" x="0" y="0" width="225" height="205"/>
      <rect class="badge-rose" x="0" y="0" width="225" height="40" rx="18"/>
      <text class="chip" x="22" y="26">4 行动出口</text>
      <text class="body" x="20" y="70">三种结果都算完成</text>
      <text class="small" x="20" y="104">沉默：不打断现场</text>
      <text class="small" x="20" y="132">求知：搜索公开事实</text>
      <text class="small" x="20" y="160">发言：说具体成立的话</text>
      <text class="tiny" x="20" y="188">stay_silent / web_search / speak</text>
    </g>

    <g transform="translate(1245 82)">
      <rect class="panel-purple" x="0" y="0" width="180" height="205"/>
      <rect class="badge-purple" x="0" y="0" width="180" height="40" rx="18"/>
      <text class="chip" x="22" y="26">5 群聊反馈</text>
      <text class="body" x="20" y="70">结果回到真实群里</text>
      <text class="small" x="20" y="104">被接住</text>
      <text class="small" x="20" y="132">冷场</text>
      <text class="small" x="20" y="160">纠偏 / 反馈</text>
      <text class="tiny" x="20" y="188">environment feedback</text>
    </g>

    <path class="arrow" d="M 255 184 H 297"/>
    <path class="arrow" d="M 550 184 H 597"/>
    <path class="arrow" d="M 915 184 H 962"/>
    <path class="arrow" d="M 1195 184 H 1237"/>
    <path class="arrow-soft" d="M 1336 287 C 1210 335 1010 335 842 306"/>
  </g>

  <g transform="translate(70 525)">
    <rect class="lane2" x="0" y="0" width="1460" height="255"/>
    <text class="h" x="28" y="40">B. 长期自进化闭环：真实后果被写入，下一轮再被召回</text>

    <g transform="translate(45 76)">
      <rect class="panel" x="0" y="0" width="265" height="130"/>
      <text class="h2" x="22" y="34">事件记忆</text>
      <text class="body" x="22" y="66">这一轮发生了什么，结果怎样</text>
      <text class="small" x="22" y="98">episode：互动、反馈、冷场、纠偏</text>
    </g>

    <g transform="translate(350 76)">
      <rect class="panel" x="0" y="0" width="265" height="130"/>
      <text class="h2" x="22" y="34">经验记忆</text>
      <text class="body" x="22" y="66">从事件里提炼出的相处分寸</text>
      <text class="small" x="22" y="98">reflection / learning state</text>
    </g>

    <g transform="translate(655 76)">
      <rect class="panel" x="0" y="0" width="265" height="130"/>
      <text class="h2" x="22" y="34">身份连续性</text>
      <text class="body" x="22" y="66">长期稳定的自我事实和边界</text>
      <text class="small" x="22" y="98">accepted identity facts</text>
    </g>

    <g transform="translate(960 76)">
      <rect class="panel" x="0" y="0" width="230" height="130"/>
      <text class="h2" x="22" y="34">小腻的OS</text>
      <text class="body" x="22" y="66">上一轮留给下一轮的余波</text>
      <text class="small" x="22" y="98">每轮自然延续</text>
    </g>

    <g transform="translate(1230 50)">
      <rect class="panel-dark" x="0" y="0" width="190" height="148"/>
      <text class="chip" x="24" y="36">下一轮召回</text>
      <text class="chip" x="24" y="72">进入工作上下文</text>
      <text class="small" x="24" y="112" fill="#d7e2df">不是堆记忆</text>
      <text class="small" x="24" y="135" fill="#d7e2df">按场景取少量材料</text>
    </g>

    <path class="arrow-gold" d="M 310 141 H 342"/>
    <path class="arrow-gold" d="M 615 141 H 647"/>
    <path class="arrow-gold" d="M 920 141 H 952"/>
    <path class="arrow-gold" d="M 1190 141 H 1222"/>
    <text class="body" x="45" y="235">业务口径：小腻不是把所有聊天都塞进记忆，而是把真实后果沉淀成下一轮可召回的少量经验。</text>
  </g>

  <path class="arrow-green" d="M 1370 490 C 1395 520 1395 560 1390 585"/>
  <text class="small" x="1398" y="535">复盘写入</text>
  <path class="arrow-green" d="M 1300 525 C 1180 440 820 438 505 525 C 420 548 390 515 425 492"/>
  <text class="small" x="790" y="472">读回下一轮</text>

  <text class="tiny" x="98" y="852">真实技术落点：NapCat 收发 QQ；provider-service 负责消息与模型出口；agent-service 负责每轮判断；长期记录在 PostgreSQL / packages/persistence。</text>
</svg>
