<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">小腻长期群聊对话与自进化闭环</title>
  <desc id="desc">A one-page business diagram that explains how Xiaoni reads a group chat, forms an life action, recalls prior learning, decides to stay silent, search, or speak, and turns the result into future learning.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8f6; }
      .title { font: 700 44px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #172026; }
      .subtitle { font: 400 22px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #51606a; }
      .section { font: 700 24px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #15242d; }
      .body { font: 400 19px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #2d3940; }
      .small { font: 400 16px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #53636c; }
      .tiny { font: 400 14px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #5a6870; }
      .label { font: 700 17px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #d8dedb; stroke-width: 2; rx: 18; }
      .card-blue { fill: #eef6fb; stroke: #9fc7dc; stroke-width: 2; rx: 18; }
      .card-green { fill: #eff8f1; stroke: #9ccca5; stroke-width: 2; rx: 18; }
      .card-yellow { fill: #fff8e7; stroke: #e5c56f; stroke-width: 2; rx: 18; }
      .card-red { fill: #fff1ef; stroke: #e3a29b; stroke-width: 2; rx: 18; }
      .card-purple { fill: #f4f0fb; stroke: #b8a8d8; stroke-width: 2; rx: 18; }
      .bar-blue { fill: #397b9b; }
      .bar-green { fill: #4a8c5a; }
      .bar-yellow { fill: #a9791b; }
      .bar-red { fill: #ad5c54; }
      .bar-purple { fill: #69549a; }
      .bar-dark { fill: #24323a; }
      .arrow { stroke: #60707a; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: #89969d; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-soft); stroke-dasharray: 8 7; }
      .loop { stroke: #4f7258; stroke-width: 3.5; fill: none; marker-end: url(#arrowhead-green); }
      .divider { stroke: #d4dad7; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#60707a"/>
    </marker>
    <marker id="arrowhead-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#89969d"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#4f7258"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="title" x="70" y="72">小腻长期群聊对话与自进化闭环</text>
  <text class="subtitle" x="72" y="112">不是“收到消息就回复”，而是每一轮都先看场、再观己、再召回经验，最后选择沉默、求知或发言。</text>

  <g transform="translate(70 162)">
    <rect class="card-blue" x="0" y="0" width="250" height="210"/>
    <rect class="bar-blue" x="0" y="0" width="250" height="48" rx="18"/>
    <text class="label" x="24" y="31">1. 群聊现场进来</text>
    <text class="body" x="24" y="78">看到的不只是一句话</text>
    <text class="small" x="24" y="112">已读聊天背景</text>
    <text class="small" x="24" y="140">这次未读消息批次</text>
    <text class="small" x="24" y="168">回复 / 引用 / @ 的关系</text>
    <text class="small" x="24" y="196">群开关与自动回复开关</text>
  </g>

  <g transform="translate(350 162)">
    <rect class="card-green" x="0" y="0" width="250" height="210"/>
    <rect class="bar-green" x="0" y="0" width="250" height="48" rx="18"/>
    <text class="label" x="24" y="31">2. 先看场</text>
    <text class="body" x="24" y="78">只理解发生了什么</text>
    <text class="small" x="24" y="112">重点是什么</text>
    <text class="small" x="24" y="140">是在问、请求、反馈</text>
    <text class="small" x="24" y="168">话是指向谁</text>
    <text class="tiny" x="24" y="196">工具：emit_unread_meaning</text>
  </g>

  <g transform="translate(630 162)">
    <rect class="card-yellow" x="0" y="0" width="250" height="210"/>
    <rect class="bar-yellow" x="0" y="0" width="250" height="48" rx="18"/>
    <text class="label" x="24" y="31">3. 再观己</text>
    <text class="body" x="24" y="78">看有没有具体可说点</text>
    <text class="small" x="24" y="112">兴趣强弱</text>
    <text class="small" x="24" y="140">观点、疑问、好奇、不适</text>
    <text class="small" x="24" y="168">该说、该查，还是沉默</text>
    <text class="tiny" x="24" y="196">工具：submit_life_action</text>
  </g>

  <g transform="translate(910 162)">
    <rect class="card-purple" x="0" y="0" width="250" height="210"/>
    <rect class="bar-purple" x="0" y="0" width="250" height="48" rx="18"/>
    <text class="label" x="24" y="31">4. 召回经验</text>
    <text class="body" x="24" y="78">少量召回过去学过的分寸</text>
    <text class="small" x="24" y="112">相似互动反馈</text>
    <text class="small" x="24" y="140">对这个人/话题的经验</text>
    <text class="small" x="24" y="168">只校准，不替代当前反应</text>
    <text class="tiny" x="24" y="196">工具：recall_long_term_learning</text>
  </g>

  <g transform="translate(1190 162)">
    <rect class="card-red" x="0" y="0" width="250" height="210"/>
    <rect class="bar-red" x="0" y="0" width="250" height="48" rx="18"/>
    <text class="label" x="24" y="31">5. 选择在场方式</text>
    <text class="body" x="24" y="78">三种结果都算完成</text>
    <text class="small" x="24" y="116">沉默：不打断现场</text>
    <text class="small" x="24" y="146">求知：先查公开事实</text>
    <text class="small" x="24" y="176">发言：只说真正承担的话</text>
    <text class="tiny" x="24" y="202">stay_silent / web_search / speak_in_group</text>
  </g>

  <path class="arrow" d="M 320 267 H 342"/>
  <path class="arrow" d="M 600 267 H 622"/>
  <path class="arrow" d="M 880 267 H 902"/>
  <path class="arrow" d="M 1160 267 H 1182"/>

  <g transform="translate(100 430)">
    <rect class="card" x="0" y="0" width="320" height="170"/>
    <rect class="bar-dark" x="0" y="0" width="320" height="45" rx="18"/>
    <text class="label" x="24" y="30">每轮带入的长期材料</text>
    <text class="small" x="24" y="76">1. 最近聊天：刚刚发生了什么</text>
    <text class="small" x="24" y="108">2. 小腻的OS：上一轮留下的余波</text>
    <text class="small" x="24" y="140">3. 身份事实与相处经验：已确认的长期学习</text>
  </g>

  <g transform="translate(470 430)">
    <rect class="card" x="0" y="0" width="300" height="170"/>
    <rect class="bar-dark" x="0" y="0" width="300" height="45" rx="18"/>
    <text class="label" x="24" y="30">底层约束</text>
    <text class="small" x="24" y="72">小腻主AGENT：身份底色</text>
    <text class="small" x="24" y="100">运行契约：先观场，再观己</text>
    <text class="small" x="24" y="128">不为“能接一句”而开口</text>
    <text class="small" x="24" y="156">说话、求知、等待、沉默都是行动</text>
  </g>

  <g transform="translate(820 430)">
    <rect class="card" x="0" y="0" width="300" height="170"/>
    <rect class="bar-dark" x="0" y="0" width="300" height="45" rx="18"/>
    <text class="label" x="24" y="30">真实结果进入复盘</text>
    <text class="small" x="24" y="76">群友接住、冷场、纠偏、反馈</text>
    <text class="small" x="24" y="108">小腻有没有说错、说多、说少</text>
    <text class="small" x="24" y="140">这一轮在关系里留下了什么</text>
  </g>

  <g transform="translate(1170 430)">
    <rect class="card-green" x="0" y="0" width="300" height="170"/>
    <rect class="bar-green" x="0" y="0" width="300" height="45" rx="18"/>
    <text class="label" x="24" y="30">自进化写入</text>
    <text class="small" x="24" y="76">抽取值得长期留下的 episode</text>
    <text class="small" x="24" y="108">沉淀 reflection / learning state</text>
    <text class="small" x="24" y="140">必要时形成身份事实候选</text>
  </g>

  <path class="arrow-soft" d="M 1338 372 C 1338 398, 1338 405, 1338 423"/>
  <path class="arrow" d="M 1120 515 H 1162"/>
  <path class="loop" d="M 1170 600 C 1060 700, 725 750, 420 600"/>
  <path class="loop" d="M 260 430 C 300 395, 340 360, 365 330"/>

  <g transform="translate(100 660)">
    <rect x="0" y="0" width="1370" height="115" rx="22" fill="#edf4ee" stroke="#b6d0bb" stroke-width="2"/>
    <text class="section" x="30" y="38">业务口径</text>
    <text class="body" x="30" y="72">自进化不是“自动改人设”，而是：每轮群聊的真实后果被记录、复盘、沉淀成经验；下一轮再被召回，用来校准小腻该不该出现、怎么出现。</text>
    <text class="body" x="30" y="100">这让小腻长期看起来像一个会记得关系、会调整边界、会从反馈中变得更会在场的群友。</text>
  </g>

  <g transform="translate(104 812)">
    <text class="tiny" x="0" y="0">真实技术落点：NapCat 收发 QQ；provider-service 负责收消息、发消息和模型出口；agent-service 负责小腻每轮判断；长期记录在 PostgreSQL / packages/persistence。</text>
    <text class="tiny" x="0" y="28">这张图只讲当前群聊主链路，不讲管理端页面。</text>
  </g>
</svg>
