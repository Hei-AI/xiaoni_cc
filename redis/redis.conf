# Redis配置文件 - QQ Bot消息队列优化

# 基础配置
port 6379
bind 0.0.0.0
protected-mode yes
requirepass qqbot123

# 持久化配置
save 900 1      # 900秒内有1个key变化则保存
save 300 10     # 300秒内有10个key变化则保存
save 60 10000   # 60秒内有10000个key变化则保存

# AOF持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 内存管理
maxmemory 1gb
maxmemory-policy allkeys-lru  # LRU淘汰策略

# 网络配置
tcp-keepalive 300
timeout 0

# 日志配置
loglevel notice
logfile "/data/redis.log"

# 队列优化配置
# 禁用一些不需要的功能以提升性能
save ""  # 禁用RDB持久化，只用AOF
stop-writes-on-bgsave-error no

# 客户端连接数限制
maxclients 1000

# 慢查询日志
slowlog-log-slower-than 10000  # 记录超过10ms的查询
slowlog-max-len 128

# 键事件通知（用于监控）
notify-keyspace-events Ex  # 过期事件通知

# 优化配置
tcp-backlog 511
databases 16
rdbcompression yes
rdbchecksum yes