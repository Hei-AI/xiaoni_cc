# ======================================================================
# QQ智能机器人 - 主业务服务配置
#
# 注意: NapCat服务已独立管理，不包含在此配置中
# NapCat运行: docker compose -f docker-compose.napcat.yml up -d
# NapCat配置: ./docker-compose.napcat.yml
#
# ⚠️ 使用 Docker Compose v2 CLI (`docker compose ...`)，旧版 `docker-compose` 命令会忽略部分配置
# ======================================================================

x-build-no-proxy: &build_no_proxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  NO_PROXY: ""
  no_proxy: ""

services:
  # Shared PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qqbot-postgres
    command: ["postgres", "-c", "timezone=Asia/Shanghai", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: qqbot_db
      POSTGRES_USER: qqbot_user
      POSTGRES_PASSWORD: qqbot_password
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./database/postgres_data:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d
    networks:
      - qq_bot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qqbot_user -d qqbot_db"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  # Local Embedding API Service
  embedding-server:
    image: qqbot-embedding-server
    build:
      context: ./modules/embedding-server
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""
        NO_PROXY: ""
        no_proxy: ""
        LLAMA_CPP_VERSION: b7472
    container_name: qqbot-embedding-server
    environment:
      - MODEL_URL=https://huggingface.co/ggml-org/embeddinggemma-300m-qat-q8_0-GGUF/resolve/main/embeddinggemma-300m-qat-Q8_0.gguf?download=true
      - MODEL_PATH=/models/embeddinggemma-300m-qat-Q8_0.gguf
      - SERVER_PORT=8080
      - MODEL_DOWNLOAD_INSECURE=true
    volumes:
      - ./models/embedding-server:/models
    restart: unless-stopped
    networks:
      - qq_bot_network

  # Provider Service
  provider-service:
    image: qqbot-provider-service
    build:
      context: .
      dockerfile: modules/provider-service/Dockerfile
      args: *build_no_proxy
    container_name: qqbot-provider-service
    ports:
      - "127.0.0.1:8091:8090"
    env_file:
      - /home/liahua/.qqbot-local/qqbot-compose.env
    environment:
      - IMAGE_LAB_JSON_LIMIT=480mb
      - HTTP_PORT=8090
      - LOG_LEVEL=info
      - TZ=Asia/Shanghai
      - DB_TIMEZONE=Asia/Shanghai
      - DATABASE_URL=postgresql://qqbot_user:qqbot_password@qqbot-postgres:5432/qqbot_db?schema=public&connection_limit=5&options=-c%20timezone%3DAsia%2FShanghai
      - DB_HOST=qqbot-postgres
      - DB_PORT=5432
      - DB_USER=qqbot_user
      - DB_PASSWORD=qqbot_password
      - DB_NAME=qqbot_db
      - BOT_QQ_NUMBER=1129974489
      - NAPCAT_HTTP_BASE_URL=http://napcat:3000
      - NAPCAT_HTTP_ACCESS_TOKEN=w@123456
      # WebUI token 独立于上面的 OneBot HTTP token，取自 resource/napcat_config/webui.json
      - NAPCAT_WEBUI_BASE_URL=http://napcat:6099
      - NAPCAT_WEBUI_TOKEN=${NAPCAT_WEBUI_TOKEN:-04e9562f9a58}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - AI_MODEL_NAME=gpt-5-mini
      - MEDIA_INSPECTOR_MODEL_NAME=${MEDIA_INSPECTOR_MODEL_NAME:-gpt-5-mini}
      - SELF_EVOLUTION_MODEL_NAME=gpt-5.4
      - SELF_EVOLUTION_TIMEOUT_MS=90000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - CODEX_BASE_URL=${CODEX_BASE_URL:-}
      # 画图收口到 cliproxyapi(openai-compat → torchai gpt-image-2);image-scoped,不动全局 OPENAI_API_KEY
      # IMAGE_PROVIDER_OPENAI_API_KEY 走 env_file(qqbot-compose.env),与 CODEX_PROXY_API_KEY 同处
      - IMAGE_PROVIDER_AUTH_MODE=openai
      - IMAGE_PROVIDER_OPENAI_BASE_URL=http://host.docker.internal:8317/v1
      - CODEX_LOCAL_AUTH_PROFILES_PATH=/root/.qqbot-local/codex-auth-profiles/auth-profiles.json
      - MODEL_PROVIDER_OVERRIDES_JSON=${MODEL_PROVIDER_OVERRIDES_JSON:-}
      - EMBEDDING_ENABLED=true
      - EMBEDDING_BASE_URL=http://qqbot-embedding-server:8080
      - EMBEDDING_MODEL_ID=embeddinggemma-300m
      - EMBEDDING_MODEL_SOURCE=hf:ggml-org/embeddinggemma-300m-qat-q8_0-GGUF/embeddinggemma-300m-qat-Q8_0.gguf
      - EMBEDDING_TIMEOUT_MS=30000
      - EMBEDDING_NORMALIZE=2
      - GEMINI_CLI_OAUTH_CLIENT_ID=${GEMINI_CLI_OAUTH_CLIENT_ID:-}
      - GEMINI_CLI_OAUTH_CLIENT_SECRET=${GEMINI_CLI_OAUTH_CLIENT_SECRET:-}
      - XIAONI_RUNTIME_ROOT=/xiaoni-runtime
    depends_on:
      - postgres
      - embedding-server
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs/provider-service:/app/logs
      - ./resource/napcat_qq_data:/app/napcat-qq-data:ro
      - ${HOME}/.qqbot-local/xiaoni-runtime:/xiaoni-runtime
      - ${HOME}/.codex:/root/.codex:ro
      - ${HOME}/.qqbot-local/codex-auth-profiles:/root/.qqbot-local/codex-auth-profiles
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.gemini:/root/.gemini
      - ./modules/http-traffic-monitor/transparent-proxy/mitmproxy-data/mitmproxy-ca-cert.pem:/certs/mitmproxy-ca-cert.pem:ro
    networks:
      - qq_bot_network

  # Xiaoni Executor
  xiaoni-executor:
    image: qqbot-xiaoni-executor
    build:
      context: .
      dockerfile: modules/xiaoni-executor/Dockerfile
      args: *build_no_proxy
    container_name: qqbot-xiaoni-executor
    ports:
      - "127.0.0.1:8093:8093"
      - "127.0.0.1:3458:3458"
    environment:
      - HTTP_PORT=8093
      - XIAONI_SITE_PORT=3458
      - XIAONI_SITE_ROOT=/xiaoni-runtime/site/xiaoni-home/dist
      - TZ=Asia/Shanghai
      - WORKSPACE_ROOT=/workspace/qq_bot
      - XIAONI_RUNTIME_ROOT=/xiaoni-runtime
      - QQ_USAGE_ENDPOINT=http://qqbot-agent-service:8092/api/internal/qq-usage
      - XIAONI_PLAYWRIGHT_CLI_BRIDGE_URL=http://host.docker.internal:9977/run,http://172.19.0.1:9977/run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace/qq_bot
      - ${HOME}/.qqbot-local/xiaoni-runtime:/xiaoni-runtime
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - qq_bot_network

  # Agent Service
  agent-service:
    image: qqbot-agent-service
    build:
      context: .
      dockerfile: modules/agent-service/Dockerfile
      args: *build_no_proxy
    container_name: qqbot-agent-service
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      - HTTP_PORT=8092
      - LOG_LEVEL=info
      - TZ=Asia/Shanghai
      - DB_TIMEZONE=Asia/Shanghai
      - DATABASE_URL=postgresql://qqbot_user:qqbot_password@qqbot-postgres:5432/qqbot_db?schema=public&connection_limit=5&options=-c%20timezone%3DAsia%2FShanghai
      - DB_HOST=qqbot-postgres
      - DB_PORT=5432
      - DB_USER=qqbot_user
      - DB_PASSWORD=qqbot_password
      - DB_NAME=qqbot_db
      - PROVIDER_SERVICE_URL=http://qqbot-provider-service:8090
      - XIAONI_EXECUTOR_URL=http://qqbot-xiaoni-executor:8093
      - XIAONI_RUNTIME_ROOT=/xiaoni-runtime
      # 画图已迁到 Claude flow:image_task 走 openai-image-provider → cliproxyapi gpt-image-2(忽略 codex_base_request)
      - XIAONI_IMAGE_TASK_ENABLED=true
      # 欠账指针通知:定时投一条「open-loops.md 里还有 N 条没划掉」,只给指针+计数不列条目。
      # 它替代了被撤出召回的那条腿(CONTEXT.md:欠账不走召回)。默认 OFF,这里显式打开。
      # 注:这个开关目前只能改 compose + 重启;投递闸那个已经在管理端(agent_runtime_control)。
      - XIAONI_OPEN_LOOPS_NOTIFY_ENABLED=true
      - AI_MODEL_NAME=gpt-5-mini
      - XIAONI_MAIN_AGENT_MODEL=${XIAONI_MAIN_AGENT_MODEL:-claude-opus-4-6}
      # api.anthropic.com from this host is ~50% reliable + ~5s/attempt; allow the
      # provider's connection retries room before the heartbeat gives up.
      - AGENT_CACHE_HEARTBEAT_TIMEOUT_MS=${AGENT_CACHE_HEARTBEAT_TIMEOUT_MS:-60000}
      - AGENT_PRE_REPLY_MEMORY_REASONER_ENABLED=true
      - AGENT_PRE_REPLY_MEMORY_REASONER_MODEL=gpt-5.4
      - AGENT_PRESENT_SELF_RECONSTRUCTION_ENABLED=true
      - AGENT_PRESENT_SELF_RECONSTRUCTION_MODEL=gpt-5.4
      # Custom web_search (client-executed in agent-service → Tavily/SearXNG, never
      # the Anthropic cloak). Replaces the removed server-side web_search. Static flag
      # so the cached tools prefix stays byte-stable. Tavily key comes from the
      # env_file; SearXNG is the in-stack container below (no key).
      - AGENT_WEB_SEARCH_ENABLED=${AGENT_WEB_SEARCH_ENABLED:-true}
      - AGENT_WEB_SEARCH_SEARXNG_URL=http://qqbot-searxng:8080/search
      # Computer use (client-executed via the host Playwright bridge) IS honored on the cloak.
      - AGENT_COMPUTER_USE_ENABLED=${AGENT_COMPUTER_USE_ENABLED:-true}
      # Same host bridge xiaoni-executor drives. Must go through host.docker.internal:
      # docker renumbers its bridge subnets across reboots, so any hardcoded gateway IP
      # silently rots (172.18.0.1 stopped existing at the 2026-07-19 reboot and killed
      # every computer_use call until 2026-08-07).
      - XIAONI_BROWSER_BRIDGE_URL=http://host.docker.internal:9977
      - MODEL_PROVIDER_OVERRIDES_JSON=${MODEL_PROVIDER_OVERRIDES_JSON:-}
      - BOT_QQ_NUMBER=1129974489
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    env_file:
      - /home/liahua/.qqbot-local/agent-service.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - provider-service
      - xiaoni-executor
    restart: unless-stopped
    networks:
      - qq_bot_network
    volumes:
      - ./logs/agent-service:/app/logs
      - ${HOME}/.qqbot-local/xiaoni-runtime:/xiaoni-runtime
      - ./docs/xiaoni_prompt:/app/docs/xiaoni_prompt:ro
      - ./modules/http-traffic-monitor/transparent-proxy/mitmproxy-data/mitmproxy-ca-cert.pem:/certs/mitmproxy-ca-cert.pem:ro

  # SearXNG — self-hosted OSS metasearch backing web_search source=searxng.
  # Internal only (no published port); agent-service reaches it on the shared network.
  searxng:
    image: searxng/searxng:latest
    container_name: qqbot-searxng
    environment:
      - SEARXNG_BASE_URL=http://qqbot-searxng:8080/
    volumes:
      - /home/liahua/.qqbot-local/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    networks:
      - qq_bot_network

  # Admin Panel Backend
  admin-backend:
    image: qqbot-admin-backend
    build:
      context: .
      dockerfile: modules/admin-panel/backend/Dockerfile
      args: *build_no_proxy
    container_name: qqbot-admin-backend
    ports:
      - "127.0.0.1:9080:9080"
    environment:
      - TZ=Asia/Shanghai
      - DB_TIMEZONE=Asia/Shanghai
      - DATABASE_URL=postgresql://qqbot_user:qqbot_password@qqbot-postgres:5432/qqbot_db?schema=public&connection_limit=5&options=-c%20timezone%3DAsia%2FShanghai
      - DB_HOST=qqbot-postgres
      - DB_PORT=5432
      - DB_USER=qqbot_user
      - DB_PASSWORD=qqbot_password
      - DB_NAME=qqbot_db
      - ADMIN_PORT=9080
      - HTTP_PORT=9080
      - PROVIDER_SERVICE_URL=http://qqbot-provider-service:8090
      - CLIPROXY_REQUEST_LOG_DIR=/app/cliproxyapi-logs
      - LOG_LEVEL=info
      - XIAONI_RUNTIME_ROOT=/xiaoni-runtime
      # 透明代理模式：使用iptables拦截，无需配置HTTP_PROXY
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - ./logs/admin-backend:/app/logs
      - ./logs/qqbot-traffic:/app/logs/traffic:ro
      - ${CLIPROXY_REQUEST_LOG_HOST_DIR:-/home/liahua/IdeaProject/CLIProxyAPI/logs}:/app/cliproxyapi-logs:ro
      - ${HOME}/.qqbot-local/xiaoni-runtime:/xiaoni-runtime:ro
      - ./modules/admin-panel/backend/resources/uploads:/app/resources/uploads
      - ./modules/http-traffic-monitor/transparent-proxy/mitmproxy-data/mitmproxy-ca-cert.pem:/certs/mitmproxy-ca-cert.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - provider-service
      - agent-service
    restart: unless-stopped
    networks:
      - qq_bot_network

  # Admin Panel Frontend
  admin-frontend:
    image: qqbot-admin-frontend
    build:
      context: ./modules/admin-panel/frontend
      args: *build_no_proxy
    container_name: qqbot-admin-frontend
    ports:
      - "0.0.0.0:3003:80"
    environment:
      - VITE_API_BASE_URL=http://qqbot-admin-backend:9080
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - admin-backend
    restart: unless-stopped
    networks:
      - qq_bot_network
    volumes:
      - ./logs/admin-frontend:/var/log/nginx

  # Authenticated local-only gateway for exposing Admin Panel via Cloudflare Tunnel
  admin-expose-proxy:
    image: caddy:2
    container_name: qqbot-admin-expose-proxy
    ports:
      - "127.0.0.1:3903:80"
    depends_on:
      - admin-frontend
    restart: unless-stopped
    networks:
      - qq_bot_network
    volumes:
      - ./modules/admin-panel/expose/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HOME}/.qqbot-local/admin-expose:/etc/caddy/local:ro

  # Operational one-off tasks (invoke with: docker compose --profile ops run --rm <service>)
  init-db:
    image: postgres:16
    profiles: ["ops"]
    command: ["sh", "-c", "psql -h postgres -U qqbot_user -d qqbot_db -f /scripts/init.sql"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-qqbot_password}
    volumes:
      - ./database/postgres/init.sql:/scripts/init.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qq_bot_network
    restart: "no"

networks:
  qq_bot_network:
    name: qq_bot_network
    driver: bridge
    attachable: true
