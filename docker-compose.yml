# ======================================================================
# QQ智能机器人 - 主业务服务配置
#
# 注意: NapCat服务已独立管理，不包含在此配置中
# NapCat运行: docker compose -f docker-compose.napcat.yml up -d
# NapCat配置: ./docker-compose.napcat.yml
#
# ⚠️ 使用 Docker Compose v2 CLI (`docker compose ...`)，旧版 `docker-compose` 命令会忽略部分配置
# ======================================================================

x-build-no-proxy: &build_no_proxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  NO_PROXY: ""
  no_proxy: ""

services:
  # Shared MySQL Database
  mysql:
    image: mysql:8.0
    container_name: qqbot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: qqbot_db
      MYSQL_USER: qqbot_user
      MYSQL_PASSWORD: qqbot_password
    ports:
      - "3306:3306"
    volumes:
      - ./database/mysql_data:/var/lib/mysql
      - ./database/schema:/docker-entrypoint-initdb.d
    networks:
      - qq_bot_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uqqbot_user", "-pqqbot_password"]
      timeout: 20s
      retries: 10

  # Local Embedding API Service
  embedding-server:
    image: qqbot-embedding-server
    build:
      context: ./modules/embedding-server
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""
        NO_PROXY: ""
        no_proxy: ""
        LLAMA_CPP_VERSION: b7472
    container_name: qqbot-embedding-server
    environment:
      - MODEL_URL=https://huggingface.co/ggml-org/embeddinggemma-300m-qat-q8_0-GGUF/resolve/main/embeddinggemma-300m-qat-Q8_0.gguf?download=true
      - MODEL_PATH=/models/embeddinggemma-300m-qat-Q8_0.gguf
      - SERVER_PORT=8080
      - MODEL_DOWNLOAD_INSECURE=true
    volumes:
      - ./models/embedding-server:/models
    restart: unless-stopped
    networks:
      - qq_bot_network

  # QQBot Core Service
  qqbot-core:
    image: qqbot-qqbot-core
    build:
      context: ./modules/qqbot-core
      args: *build_no_proxy
    container_name: qqbot-qqbot-core
    ports:
      - "8081:8081"
    environment:
      - MYSQL_HOST=qqbot-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=qqbot_user
      - MYSQL_PASSWORD=qqbot_password
      - MYSQL_DATABASE=qqbot_db
      - HTTP_PORT=8081
      - INTERNAL_HTTP_PORT=8081
      - LOG_LEVEL=info
      # WebSocket连接配置 - 连接主 NapCat 容器
      - BOT_QQ_NUMBER=1129974489
      - WEBSOCKET_HOST=napcat
      - WEBSOCKET_PORT=3001
      - WEBSOCKET_ACCESS_TOKEN=w@123456
      - ENABLE_FUNCTION_REGISTRY=false
      # 透明代理模式：使用iptables拦截，无需配置HTTP_PROXY
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - ENABLE_LLM_TOOLS=true
      - LLM_MAX_CONCURRENT_JOBS=5
      - LLM_POLL_INTERVAL_MS=1000
      - LLM_JOB_TIMEOUT_MS=300000
      - LLM_RETRY_DELAY_MS=5000
      - AI_MODEL_NAME=gpt-5.4-mini
      - EMBEDDING_ENABLED=true
      - EMBEDDING_BASE_URL=http://qqbot-embedding-server:8080
      - EMBEDDING_MODEL_ID=embeddinggemma-300m
      - EMBEDDING_MODEL_SOURCE=hf:ggml-org/embeddinggemma-300m-qat-q8_0-GGUF/embeddinggemma-300m-qat-Q8_0.gguf
      - EMBEDDING_TIMEOUT_MS=30000
      - EMBEDDING_NORMALIZE=2
      - PROACTIVITY_ENABLED=true
      - PROACTIVE_FOLLOWUP_ALLOWED_USER_IDS=85178516
      - PROACTIVE_FOLLOWUP_MAX_PER_RUN=1
      - PROACTIVE_FOLLOWUP_RETRY_DELAY_MS=21600000
      - GEMINI_CLI_OAUTH_CLIENT_ID=${GEMINI_CLI_OAUTH_CLIENT_ID:-}
      - GEMINI_CLI_OAUTH_CLIENT_SECRET=${GEMINI_CLI_OAUTH_CLIENT_SECRET:-}
    depends_on:
      - mysql
      - embedding-server
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./logs/qqbot-core:/app/logs
      - ./modules/qqbot-core/resources/config:/app/resources/config
      - ./modules/qqbot-core/resources/napcat_qq_data:/app/resources/napcat_qq_data
      - ${HOME}/.codex:/root/.codex
      - ${HOME}/.gemini:/root/.gemini
    networks:
      - qq_bot_network

  # Admin Panel Backend
  admin-backend:
    image: qqbot-admin-backend
    build:
      context: ./modules/admin-panel/backend
      args: *build_no_proxy
    container_name: qqbot-admin-backend
    ports:
      - "127.0.0.1:9080:9080"
    environment:
      - DB_HOST=qqbot-mysql
      - DB_PORT=3306
      - DB_USER=qqbot_user
      - DB_PASSWORD=qqbot_password
      - DB_NAME=qqbot_db
      - ADMIN_PORT=9080
      - HTTP_PORT=9080
      - QQBOT_CORE_URL=http://qqbot-qqbot-core:8081
      - LOG_LEVEL=info
      # 透明代理模式：使用iptables拦截，无需配置HTTP_PROXY
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - ./logs/admin-backend:/app/logs
      - ./logs/qqbot-traffic:/app/logs/traffic:ro
      - ./modules/admin-panel/backend/resources/uploads:/app/resources/uploads
    depends_on:
      - mysql
      - qqbot-core
    restart: unless-stopped
    networks:
      - qq_bot_network

  # Admin Panel Frontend
  admin-frontend:
    image: qqbot-admin-frontend
    build:
      context: ./modules/admin-panel/frontend
      args: *build_no_proxy
    container_name: qqbot-admin-frontend
    ports:
      - "127.0.0.1:3003:80"
    environment:
      - VITE_API_BASE_URL=http://qqbot-admin-backend:9080
    depends_on:
      - admin-backend
    restart: unless-stopped
    networks:
      - qq_bot_network
    volumes:
      - ./logs/admin-frontend:/var/log/nginx

  # Authenticated local-only gateway for exposing Admin Panel via Cloudflare Tunnel
  admin-expose-proxy:
    image: caddy:2
    container_name: qqbot-admin-expose-proxy
    ports:
      - "127.0.0.1:3903:80"
    depends_on:
      - admin-frontend
    restart: unless-stopped
    networks:
      - qq_bot_network
    volumes:
      - ./modules/admin-panel/expose/Caddyfile:/etc/caddy/Caddyfile:ro

  # Operational one-off tasks (invoke with: docker compose --profile ops run --rm <service>)
  init-db:
    image: mysql:8.0
    profiles: ["ops"]
    command: ["sh", "-c", "mysql -hmysql -uroot < /scripts/init.sql"]
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - ./scripts/init-database-docker.sql:/scripts/init.sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qq_bot_network
    restart: "no"

networks:
  qq_bot_network:
    name: qq_bot_network
    driver: bridge
    attachable: true
