# ======================================================================
# QQ智能机器人 - 主业务服务配置
#
# 注意: NapCat服务已独立管理，不包含在此配置中
# NapCat管理: ./scripts/napcat-manage.sh
# NapCat配置: ./docker-compose.napcat.yml
#
# ⚠️ 使用 Docker Compose v2 CLI (`docker compose ...`)，旧版 `docker-compose` 命令会忽略部分配置
# ======================================================================

x-build-no-proxy: &build_no_proxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  NO_PROXY: ""
  no_proxy: ""

services:
  # Shared MySQL Database
  mysql:
    image: mysql:8.0
    container_name: qqbot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: qqbot_db
      MYSQL_USER: qqbot_user
      MYSQL_PASSWORD: qqbot_password
    ports:
      - "3306:3306"
    volumes:
      - ./database/mysql_data:/var/lib/mysql
      - ./database/schema:/docker-entrypoint-initdb.d
    networks:
      - qq_bot_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # HTTP API Gateway
  http-api:
    image: qqbot-http-api
    build:
      context: ./modules/http-api
      args: *build_no_proxy
    container_name: qqbot-http-api
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=8080
      - QQBOT_CORE_URL=http://qqbot-qqbot-core:8081
      - LOG_LEVEL=info
      # 透明代理模式：使用iptables拦截，无需配置HTTP_PROXY
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - qqbot-core
    networks:
      - qq_bot_network
    volumes:
      - ./logs/http-api:/app/logs

  # QQBot Core Service
  qqbot-core:
    image: qqbot-qqbot-core
    build:
      context: ./modules/qqbot-core
      args: *build_no_proxy
    container_name: qqbot-qqbot-core
    ports:
      - "8081:8081"
    environment:
      - MYSQL_HOST=qqbot-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=qqbot_user
      - MYSQL_PASSWORD=qqbot_password
      - MYSQL_DATABASE=qqbot_db
      - HTTP_PORT=8081
      - INTERNAL_HTTP_PORT=8081
      - LOG_LEVEL=info
      # WebSocket连接配置 - 直接连接napcat容器
      - WEBSOCKET_HOST=napcat
      - WEBSOCKET_PORT=3001
      - WEBSOCKET_ACCESS_TOKEN=w@123456
      # 透明代理模式：使用iptables拦截，无需配置HTTP_PROXY
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - ENABLE_LLM_TOOLS=true
      - LLM_MAX_CONCURRENT_JOBS=5
      - LLM_POLL_INTERVAL_MS=1000
      - LLM_JOB_TIMEOUT_MS=300000
      - LLM_RETRY_DELAY_MS=5000
    depends_on:
      - mysql
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./logs/qqbot-core:/app/logs
      - ./modules/qqbot-core/resources/config:/app/resources/config
      - ./modules/qqbot-core/resources/napcat_qq_data:/app/resources/napcat_qq_data
    networks:
      - qq_bot_network

  # Admin Panel Backend
  admin-backend:
    image: qqbot-admin-backend
    build:
      context: ./modules/admin-panel/backend
      args: *build_no_proxy
    container_name: qqbot-admin-backend
    ports:
      - "9080:9080"
    environment:
      - DB_HOST=qqbot-mysql
      - DB_PORT=3306
      - DB_USER=qqbot_user
      - DB_PASSWORD=qqbot_password
      - DB_NAME=qqbot_db
      - ADMIN_PORT=9080
      - HTTP_PORT=9080
      - QQBOT_CORE_URL=http://qqbot-qqbot-core:8081
      - LOG_LEVEL=info
      # 透明代理模式：使用iptables拦截，无需配置HTTP_PROXY
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - ./logs/admin-backend:/app/logs
      - ./logs/qqbot-traffic:/app/logs/traffic:ro
      - ./modules/admin-panel/backend/resources/uploads:/app/resources/uploads
    depends_on:
      - mysql
      - qqbot-core
    restart: unless-stopped
    networks:
      - qq_bot_network

  # Admin Panel Frontend
  admin-frontend:
    image: qqbot-admin-frontend
    build:
      context: ./modules/admin-panel/frontend
      args: *build_no_proxy
    container_name: qqbot-admin-frontend
    ports:
      - "3003:80"
    environment:
      - VITE_API_BASE_URL=http://qqbot-admin-backend:9080
    depends_on:
      - admin-backend
    restart: unless-stopped
    networks:
      - qq_bot_network
    volumes:
      - ./logs/admin-frontend:/var/log/nginx

  # Operational one-off tasks (invoke with: docker compose --profile ops run --rm <service>)
  init-db:
    image: mysql:8.0
    profiles: ["ops"]
    command: ["sh", "-c", "mysql -hmysql -uroot < /scripts/init.sql"]
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - ./scripts/init-database-docker.sql:/scripts/init.sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qq_bot_network
    restart: "no"

  update-llm-config:
    image: mysql:8.0
    profiles: ["ops"]
    command: ["sh", "-c", "mysql -hmysql -uqqbot_user qqbot_db < /scripts/update.sql"]
    environment:
      MYSQL_PWD: ${MYSQL_PASSWORD:-qqbot_password}
    volumes:
      - ./database/migrations/005_extend_agent_prompts_advanced_configs.sql:/scripts/update.sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qq_bot_network
    restart: "no"

  test-llm-config:
    image: node:18-alpine
    profiles: ["ops"]
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      set -e;
      apk add --no-cache curl jq;
      BASE_URL="http://qqbot-admin-backend:9080";
      curl -sf "$$BASE_URL/api/llm-config/agents" | jq . >/dev/null;
      curl -sf "$$BASE_URL/api/llm-config/pipelines" | jq . >/dev/null;
      curl -sf "$$BASE_URL/api/llm-config/tools" | jq . >/dev/null;
      echo "LLM configuration endpoints responded successfully."
    depends_on:
      admin-backend:
        condition: service_healthy
    networks:
      - qq_bot_network
    restart: "no"

networks:
  qq_bot_network:
    name: qq_bot_network
    driver: bridge
    attachable: true
