# NapCat独立部署配置
# 用于稳定的QQ协议适配器服务，与主业务服务分离管理
# 启动: docker compose -f docker-compose.napcat.yml up -d
# 停止: docker compose -f docker-compose.napcat.yml down

services:
  # NapCat QQ协议适配器
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    ports:
      - "3000:3000"  # NapCat HTTP API
      - "3001:3001"  # NapCat WebSocket
      - "6099:6099"  # QQ客户端端口
    volumes:
      # NapCat配置和数据持久化（启动前确保这些目录已创建）
      - ./resource/napcat_config:/app/napcat/config
      - ./resource/napcat_qq_data:/app/.config/QQ
      - ./logs/napcat:/app/logs
    environment:
      # NapCat基础配置
      - NAPCAT_GID=0
      - NAPCAT_UID=0
      - NAPCAT_TRACE=0
      # 使用已缓存账号做快速登录，避免重启后重新扫码
      - ACCOUNT=1129974489
    networks:
      - qq_bot_network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "QQ"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 添加资源限制确保稳定性
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

networks:
  # 使用共享的qq_bot_network网络
  qq_bot_network:
    name: qq_bot_network
    driver: bridge
    attachable: true

# Volumes for persistent data
volumes:
  napcat_config:
    driver: local
  napcat_qq_data:
    driver: local
