version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: qqbot_mysql_ts
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: qqbot_root_password
      MYSQL_DATABASE: qqbot_db
      MYSQL_USER: qqbot_user
      MYSQL_PASSWORD: qqbot_password
    ports:
      - "3306:3306"
    volumes:
      - ./database/mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - qqbot_network
    command: --default-authentication-plugin=mysql_native_password

  # QQ Bot TypeScript Application
  qqbot-ts:
    build:
      context: .
      dockerfile: Dockerfile.ts
    container_name: qqbot_app_ts
    restart: always
    environment:
      - NODE_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=qqbot_db
      - MYSQL_USER=qqbot_user
      - MYSQL_PASSWORD=qqbot_password
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    depends_on:
      - mysql
    networks:
      - qqbot_network

networks:
  qqbot_network:
    driver: bridge