<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ智能机器人 - 对话历史管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .conversation-item {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .conversation-item:hover {
            background-color: #f8f9fa;
        }
        .conversation-item.selected {
            background-color: #e3f2fd;
            border-left: 4px solid #2196f3;
        }
        .conversation-detail {
            max-height: 600px;
            overflow-y: auto;
        }
        .message-content {
            white-space: pre-wrap;
            word-break: break-word;
        }
        .user-message {
            background-color: #e1f5fe;
            border-left: 4px solid #03a9f4;
        }
        .ai-response {
            background-color: #f3e5f5;
            border-left: 4px solid #9c27b0;
        }
        .loading {
            display: none;
        }
        .loading.show {
            display: block;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }
        .filters-card {
            position: sticky;
            top: 1rem;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-3">
        <!-- 页面头部 -->
        <div class="row mb-4">
            <div class="col">
                <div class="d-flex justify-content-between align-items-center">
                    <h2><i class="fas fa-comments me-2"></i>对话历史管理</h2>
                    <div>
                        <a href="/dashboard" class="btn btn-outline-primary">
                            <i class="fas fa-arrow-left me-1"></i>返回仪表板
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 筛选区域 -->
        <div class="row mb-3">
            <div class="col">
                <div class="card filters-card">
                    <div class="card-body">
                        <form id="filterForm">
                            <div class="row g-3">
                                <div class="col-md-2">
                                    <label class="form-label">用户ID</label>
                                    <input type="number" class="form-control" id="userId" placeholder="QQ号">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">开始日期</label>
                                    <input type="date" class="form-control" id="startDate">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">结束日期</label>
                                    <input type="date" id="endDate" class="form-control">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">关键词</label>
                                    <input type="text" class="form-control" id="searchKeyword" placeholder="搜索消息内容">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">AI模型</label>
                                    <select class="form-select" id="modelName">
                                        <option value="">所有模型</option>
                                        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                                        <option value="gemini-pro">Gemini Pro</option>
                                    </select>
                                </div>
                                <div class="col-md-2 d-flex align-items-end">
                                    <div class="btn-group w-100">
                                        <button type="submit" class="btn btn-primary">
                                            <i class="fas fa-search me-1"></i>搜索
                                        </button>
                                        <button type="button" class="btn btn-secondary" id="resetBtn">
                                            <i class="fas fa-undo me-1"></i>重置
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="row mt-2">
                                <div class="col">
                                    <small class="text-muted">
                                        <i class="fas fa-info-circle me-1"></i>
                                        提示：可单独使用任一筛选条件，或组合使用多个条件
                                    </small>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 主内容区域 -->
        <div class="row">
            <!-- 对话列表 -->
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-list me-1"></i>对话列表</span>
                        <span class="badge bg-secondary" id="totalCount">0 条</span>
                    </div>
                    <div class="card-body p-0">
                        <!-- 加载状态 -->
                        <div class="loading text-center p-4" id="listLoading">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                            <div class="mt-2">加载对话数据...</div>
                        </div>
                        
                        <!-- 对话列表容器 -->
                        <div id="conversationList" style="height: 600px; overflow-y: auto;">
                            <div class="empty-state">
                                <i class="fas fa-comments fa-3x mb-3"></i>
                                <h5>暂无对话记录</h5>
                                <p>请调整筛选条件或检查数据</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 分页 -->
                    <div class="card-footer">
                        <nav>
                            <ul class="pagination justify-content-center mb-0" id="pagination">
                                <!-- 动态生成分页 -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
            
            <!-- 对话详情 -->
            <div class="col-md-7">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-info-circle me-1"></i>对话详情
                    </div>
                    <div class="card-body">
                        <div class="conversation-detail" id="conversationDetail">
                            <div class="empty-state">
                                <i class="fas fa-mouse-pointer fa-3x mb-3"></i>
                                <h5>请选择对话</h5>
                                <p>点击左侧对话列表中的任一项查看详情</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        class ConversationManager {
            constructor() {
                this.currentPage = 1;
                this.pageSize = 20;
                this.filters = {};
                this.selectedConversationId = null;
                
                this.init();
            }
            
            init() {
                // 绑定事件
                document.getElementById('filterForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.applyFilters();
                });
                
                document.getElementById('resetBtn').addEventListener('click', () => {
                    this.resetFilters();
                });
                
                // 设置默认日期范围（最近30天）
                const endDate = new Date();
                const startDate = new Date();
                startDate.setDate(startDate.getDate() - 30);
                
                document.getElementById('endDate').value = endDate.toISOString().split('T')[0];
                document.getElementById('startDate').value = startDate.toISOString().split('T')[0];
                
                // 初始加载
                this.loadConversations();
            }
            
            async loadConversations(page = 1) {
                try {
                    this.currentPage = page;
                    this.showLoading(true);
                    
                    const params = new URLSearchParams({
                        page: page.toString(),
                        limit: this.pageSize.toString(),
                        ...this.filters
                    });
                    
                    console.log('Loading conversations with params:', params.toString());
                    
                    const response = await fetch(`/api/conversations?${params}`);
                    const result = await response.json();
                    
                    if (result.success) {
                        this.renderConversationList(result.data.conversations || result.data, result.data.pagination);
                        this.updateTotalCount(result.data.pagination?.total_count || result.data.length);
                        this.renderPagination(result.data.pagination);
                    } else {
                        this.showError('加载对话失败: ' + (result.message || 'Unknown error'));
                    }
                } catch (error) {
                    console.error('Error loading conversations:', error);
                    this.showError('网络错误: ' + error.message);
                } finally {
                    this.showLoading(false);
                }
            }
            
            renderConversationList(conversations, pagination) {
                const listEl = document.getElementById('conversationList');
                
                if (!conversations || conversations.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-search fa-3x mb-3"></i>
                            <h5>未找到对话记录</h5>
                            <p>请尝试调整筛选条件</p>
                        </div>
                    `;
                    return;
                }
                
                const html = conversations.map(conv => {
                    const date = new Date(conv.timestamp).toLocaleString('zh-CN');
                    const preview = conv.user_message.length > 80 
                        ? conv.user_message.substring(0, 80) + '...' 
                        : conv.user_message;
                    
                    return `
                        <div class="conversation-item p-3 border-bottom ${conv.id === this.selectedConversationId ? 'selected' : ''}" 
                             data-id="${conv.id}" onclick="conversationManager.showDetail('${conv.id}')">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="flex-grow-1">
                                    <div class="d-flex align-items-center mb-1">
                                        <strong class="me-2">
                                            <i class="fas fa-user me-1"></i>${conv.user_id}
                                        </strong>
                                        <small class="text-muted">${date}</small>
                                    </div>
                                    <div class="text-muted small mb-1">
                                        <i class="fas fa-clock me-1"></i>响应时间: ${conv.response_time}s
                                        <span class="ms-2">
                                            <i class="fas fa-robot me-1"></i>${conv.model_name}
                                        </span>
                                    </div>
                                    <div class="text-truncate" style="max-width: 300px;">
                                        ${this.highlightText(preview)}
                                    </div>
                                </div>
                                <div class="ms-2">
                                    <i class="fas fa-chevron-right text-muted"></i>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                listEl.innerHTML = html;
            }
            
            async showDetail(conversationId) {
                try {
                    this.selectedConversationId = conversationId;
                    
                    // 更新列表选中状态
                    document.querySelectorAll('.conversation-item').forEach(item => {
                        item.classList.toggle('selected', item.dataset.id === conversationId);
                    });
                    
                    const response = await fetch(`/api/conversations/${conversationId}`);
                    const result = await response.json();
                    
                    if (result.success && result.data) {
                        this.renderConversationDetail(result.data);
                    } else {
                        this.showError('加载对话详情失败');
                    }
                } catch (error) {
                    console.error('Error loading conversation detail:', error);
                    this.showError('网络错误: ' + error.message);
                }
            }
            
            renderConversationDetail(conversation) {
                const detailEl = document.getElementById('conversationDetail');
                const date = new Date(conversation.timestamp).toLocaleString('zh-CN');
                
                const html = `
                    <div class="mb-4">
                        <h6><i class="fas fa-info-circle me-1"></i>对话信息</h6>
                        <div class="row g-2">
                            <div class="col-6">
                                <strong>用户ID:</strong> ${conversation.user_id}
                            </div>
                            <div class="col-6">
                                <strong>时间:</strong> ${date}
                            </div>
                            <div class="col-6">
                                <strong>AI模型:</strong> ${conversation.model_name}
                            </div>
                            <div class="col-6">
                                <strong>响应时间:</strong> ${conversation.response_time}s
                            </div>
                            ${conversation.message_id ? `
                            <div class="col-6">
                                <strong>消息ID:</strong> ${conversation.message_id}
                            </div>
                            ` : ''}
                            ${conversation.session_id ? `
                            <div class="col-6">
                                <strong>会话ID:</strong> ${conversation.session_id}
                            </div>
                            ` : ''}
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <h6><i class="fas fa-user me-1"></i>用户消息</h6>
                        <div class="user-message p-3 rounded">
                            <div class="message-content">${this.highlightText(conversation.user_message)}</div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <h6><i class="fas fa-robot me-1"></i>AI回复</h6>
                        <div class="ai-response p-3 rounded">
                            <div class="message-content">${this.highlightText(conversation.ai_response)}</div>
                        </div>
                    </div>
                    
                    <div class="text-end">
                        <small class="text-muted">对话ID: ${conversation.id}</small>
                    </div>
                `;
                
                detailEl.innerHTML = html;
            }
            
            highlightText(text) {
                if (!this.filters.search) return this.escapeHtml(text);
                
                const keyword = this.filters.search;
                const escapedText = this.escapeHtml(text);
                const regex = new RegExp(`(${this.escapeHtml(keyword)})`, 'gi');
                return escapedText.replace(regex, '<mark>$1</mark>');
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            renderPagination(pagination) {
                const paginationEl = document.getElementById('pagination');
                
                if (!pagination) {
                    paginationEl.innerHTML = '';
                    return;
                }
                
                let html = '';
                
                // 上一页
                html += `
                    <li class="page-item ${!pagination.has_previous ? 'disabled' : ''}">
                        <a class="page-link" href="#" onclick="conversationManager.loadConversations(${this.currentPage - 1})" 
                           ${!pagination.has_previous ? 'tabindex="-1"' : ''}>
                            <i class="fas fa-chevron-left me-1"></i>上一页
                        </a>
                    </li>
                `;
                
                // 页码显示
                const startPage = Math.max(1, this.currentPage - 2);
                const endPage = Math.min(pagination.total_pages, this.currentPage + 2);
                
                if (startPage > 1) {
                    html += `
                        <li class="page-item">
                            <a class="page-link" href="#" onclick="conversationManager.loadConversations(1)">1</a>
                        </li>
                    `;
                    if (startPage > 2) {
                        html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                    }
                }
                
                for (let i = startPage; i <= endPage; i++) {
                    html += `
                        <li class="page-item ${i === this.currentPage ? 'active' : ''}">
                            <a class="page-link" href="#" onclick="conversationManager.loadConversations(${i})">${i}</a>
                        </li>
                    `;
                }
                
                if (endPage < pagination.total_pages) {
                    if (endPage < pagination.total_pages - 1) {
                        html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                    }
                    html += `
                        <li class="page-item">
                            <a class="page-link" href="#" onclick="conversationManager.loadConversations(${pagination.total_pages})">${pagination.total_pages}</a>
                        </li>
                    `;
                }
                
                // 下一页
                html += `
                    <li class="page-item ${!pagination.has_next ? 'disabled' : ''}">
                        <a class="page-link" href="#" onclick="conversationManager.loadConversations(${this.currentPage + 1})"
                           ${!pagination.has_next ? 'tabindex="-1"' : ''}>
                            下一页<i class="fas fa-chevron-right ms-1"></i>
                        </a>
                    </li>
                `;
                
                paginationEl.innerHTML = html;
            }
            
            updateTotalCount(count) {
                document.getElementById('totalCount').textContent = `${count} 条`;
            }
            
            applyFilters() {
                this.filters = {};
                
                const userId = document.getElementById('userId').value;
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                const searchKeyword = document.getElementById('searchKeyword').value;
                const modelName = document.getElementById('modelName').value;
                
                if (userId) this.filters.user_id = userId;
                if (startDate) this.filters.start_date = startDate;
                if (endDate) this.filters.end_date = endDate;
                if (searchKeyword) this.filters.search = searchKeyword;
                if (modelName) this.filters.model_name = modelName;
                
                console.log('Applying filters:', this.filters);
                this.loadConversations(1); // 重置到第一页
            }
            
            resetFilters() {
                document.getElementById('filterForm').reset();
                
                // 重新设置默认日期范围
                const endDate = new Date();
                const startDate = new Date();
                startDate.setDate(startDate.getDate() - 30);
                
                document.getElementById('endDate').value = endDate.toISOString().split('T')[0];
                document.getElementById('startDate').value = startDate.toISOString().split('T')[0];
                
                this.filters = {};
                this.loadConversations(1);
            }
            
            showLoading(show) {
                const loadingEl = document.getElementById('listLoading');
                loadingEl.classList.toggle('show', show);
            }
            
            showError(message) {
                const listEl = document.getElementById('conversationList');
                listEl.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle fa-3x mb-3 text-warning"></i>
                        <h5>加载失败</h5>
                        <p>${message}</p>
                        <button class="btn btn-primary" onclick="conversationManager.loadConversations()">
                            <i class="fas fa-refresh me-1"></i>重试
                        </button>
                    </div>
                `;
            }
        }
        
        // 初始化
        const conversationManager = new ConversationManager();
    </script>
</body>
</html>
